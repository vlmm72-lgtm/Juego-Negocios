<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto UPS: Puzzle Deslizante 3x3</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        instBlue: '#0033a0',
                        instBlueLight: '#1a4db8',
                        instYellow: '#ffb81c',
                        instYellowHover: '#e5a519'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
            color: #1f2937;
            overflow-x: hidden;
        }

        #puzzle-wrapper {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1; /* Cuadrado perfecto */
            margin: 0 auto;
        }

        #puzzle-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #001f60; /* Fondo oscuro para resaltar el hueco vacío */
            border-radius: 0.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 51, 160, 0.4);
            border: 4px solid #ffb81c;
        }

        .puzzle-tile {
            position: absolute;
            background-repeat: no-repeat;
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2), 2px 2px 6px rgba(0,0,0,0.6);
            border-radius: 4px;
        }

        .puzzle-tile:hover {
            filter: brightness(1.15);
            z-index: 10;
        }

        .modal {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            display: flex;
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center py-8 px-4">

    <div class="w-full max-w-2xl bg-white rounded-3xl shadow-2xl p-6 md:p-10 text-center border-t-8 border-instBlue">
        <div class="flex justify-center mb-4">
            <!-- Icono decorativo SVG -->
            <svg class="w-12 h-12 text-instYellow" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 00-1-1H4a1 1 0 01-1-1V4a1 1 0 011-1h3a1 1 0 011 1v1a2 2 0 004 0V4z"></path>
            </svg>
        </div>
        <h1 class="text-3xl font-black text-instBlue mb-2 tracking-tight">Misión Transformación</h1>
        <p class="text-gray-600 mb-8 font-medium">Ordena las 9 piezas moviéndolas hacia el espacio vacío para descubrir el mensaje oculto.</p>

        <!-- Área del juego -->
        <div id="puzzle-wrapper">
            <div id="puzzle-container">
                <!-- Las piezas se inyectarán aquí mediante JS -->
            </div>
        </div>
        
        <div class="mt-10">
            <button id="restart-btn" class="bg-instBlue hover:bg-instBlueLight text-white font-bold py-3 px-8 rounded-full shadow-lg transition transform hover:-translate-y-1 flex items-center justify-center mx-auto w-full sm:w-auto">
                <svg class="w-5 h-5 mr-2 text-instYellow" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                Mezclar de nuevo
            </button>
        </div>
    </div>

    <!-- Modal de victoria -->
    <div id="victory-modal" class="modal fixed inset-0 bg-instBlue/90 z-50 items-center justify-center backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full mx-4 text-center transform scale-95 transition-transform duration-500 shadow-2xl border-b-8 border-instYellow">
            <div class="w-24 h-24 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-6 text-instYellow shadow-inner border-4 border-instBlue">
                <svg class="w-12 h-12" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1.323l3.954 1.582 1.599-.8a1 1 0 01.894 1.79l-1.233.616 1.738 5.42a1 1 0 01-.285 1.05A3.989 3.989 0 0115 15a3.984 3.984 0 01-2.659-.997 1 1 0 00-1.338.029 3.998 3.998 0 01-5.006 0 1 1 0 00-1.338-.029A3.984 3.984 0 012 15a3.989 3.989 0 01-2.073-2.818 1 1 0 01-.285-1.05l1.738-5.42-1.233-.617a1 1 0 01.894-1.788l1.599.799L6.592 4.323 10 2zm1 4.793V4.323l-3.328 1.331A2.001 2.001 0 005 8.32V10a5.002 5.002 0 004 4.898V16h2v-1.102A5.002 5.002 0 0015 10V8.32a2.001 2.001 0 00-2.672-2.666L11 6.793z" clip-rule="evenodd"></path>
                </svg>
            </div>
            <h2 class="text-3xl font-black text-instBlue mb-4">¡Reto Completado!</h2>
            
            <div class="bg-gray-50 p-6 rounded-xl border border-gray-200 mb-6 shadow-inner">
                <p class="text-xl font-bold text-gray-800 leading-relaxed italic">
                    "Prueba superada, ahora pide al Lcdo. Naranjo la siguiente pista."
                </p>
            </div>
            
            <p class="text-sm text-gray-500 mb-8 font-medium">Movimientos realizados: <span id="move-count" class="font-bold text-instBlue text-lg">0</span></p>
            
            <button id="close-modal-btn" class="w-full bg-instYellow hover:bg-instYellowHover text-gray-900 font-bold py-4 px-4 rounded-xl shadow-md transition text-lg">
                Entendido
            </button>
        </div>
    </div>

    <script>
        // Cambiamos el grid de 4 a 3 para cumplir el requisito (3x3)
        const GRID_SIZE = 3;
        const TOTAL_TILES = GRID_SIZE * GRID_SIZE;

        let generatedImageSrc = null;
        let board = [];
        let emptyIndex = TOTAL_TILES - 1; 
        
        let containerSize = 0;
        let tileSize = 0;
        let moves = 0;
        let isPlaying = false;

        // Referencias DOM
        const puzzleWrapper = document.getElementById('puzzle-wrapper');
        const puzzleContainer = document.getElementById('puzzle-container');
        const restartBtn = document.getElementById('restart-btn');
        const victoryModal = document.getElementById('victory-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const moveCountDisplay = document.getElementById('move-count');

        // Inicialización
        window.addEventListener('DOMContentLoaded', () => {
            generatedImageSrc = generatePuzzleImage();
            initGame();
        });

        // Responsividad: reajustar tamaños al redimensionar la ventana
        window.addEventListener('resize', () => {
            if (isPlaying) {
                updateDimensions();
                renderBoard();
            }
        });

        restartBtn.addEventListener('click', shuffleAndRender);
        
        closeModalBtn.addEventListener('click', () => {
            victoryModal.classList.remove('active');
            shuffleAndRender();
        });

        function generatePuzzleImage() {
            const canvas = document.createElement('canvas');
            const SIZE = 600; // Resolución base para buena calidad
            canvas.width = SIZE;
            canvas.height = SIZE;
            const ctx = canvas.getContext('2d');

            // Fondo Azul Institucional
            ctx.fillStyle = '#0033A0';
            ctx.fillRect(0, 0, SIZE, SIZE);

            // Configuraciones base de texto
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const centerX = SIZE / 2;

            // Línea 1: "UPS:"
            ctx.font = '900 120px Inter, sans-serif';
            ctx.fillStyle = '#ffb81c'; // Amarillo Institucional
            ctx.fillText('UPS:', centerX, 110);

            // Línea 2: "Más que educar,"
            ctx.font = '700 55px Inter, sans-serif';
            let grad2 = ctx.createLinearGradient(100, 0, 500, 0);
            grad2.addColorStop(0, '#00ffff'); // Cyan
            grad2.addColorStop(1, '#00ff88'); // Verde
            ctx.fillStyle = grad2;
            ctx.fillText('Más que educar,', centerX, 240);

            // Línea 3: "transformamos"
            ctx.font = '900 65px Inter, sans-serif';
            let grad3 = ctx.createLinearGradient(50, 0, 550, 0);
            grad3.addColorStop(0, '#ff7f00'); // Naranja
            grad3.addColorStop(1, '#ffdf00'); // Amarillo claro
            ctx.fillStyle = grad3;
            ctx.fillText('transformamos', centerX, 340);

            // Línea 4: "Vidas"
            ctx.font = '900 140px Inter, sans-serif';
            let grad4 = ctx.createLinearGradient(150, 0, 450, 0);
            grad4.addColorStop(0, '#ff0055'); // Rojo/Rosado oscuro
            grad4.addColorStop(1, '#ff69b4'); // Rosado vibrante
            ctx.fillStyle = grad4;
            
            // Sombreado para resaltar la última palabra
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 4;
            ctx.shadowOffsetY = 4;
            ctx.fillText('Vidas', centerX, 470);
            
            ctx.shadowColor = 'transparent'; // Limpiar sombra

            return canvas.toDataURL('image/png');
        }

        function updateDimensions() {
            const rect = puzzleWrapper.getBoundingClientRect();
            containerSize = rect.width;
            tileSize = containerSize / GRID_SIZE;

            const tiles = document.querySelectorAll('.puzzle-tile');
            tiles.forEach(tile => {
                tile.style.width = `${tileSize}px`;
                tile.style.height = `${tileSize}px`;
                tile.style.backgroundSize = `${containerSize}px ${containerSize}px`;
                
                const id = parseInt(tile.id.split('-')[1]);
                const origX = (id % GRID_SIZE) * tileSize;
                const origY = Math.floor(id / GRID_SIZE) * tileSize;
                tile.style.backgroundPosition = `-${origX}px -${origY}px`;
            });
        }

        function initGame() {
            puzzleContainer.innerHTML = '';
            board = [];
            
            for (let i = 0; i < TOTAL_TILES; i++) {
                board.push(i);
            }
            emptyIndex = TOTAL_TILES - 1;

            const rect = puzzleWrapper.getBoundingClientRect();
            containerSize = rect.width;
            tileSize = containerSize / GRID_SIZE;

            for (let i = 0; i < TOTAL_TILES; i++) {
                if (i === TOTAL_TILES - 1) continue; // Saltamos la pieza 8 (hueco en 3x3)

                const tile = document.createElement('div');
                tile.className = 'puzzle-tile';
                tile.id = `tile-${i}`;
                
                tile.style.width = `${tileSize}px`;
                tile.style.height = `${tileSize}px`;
                tile.style.backgroundImage = `url('${generatedImageSrc}')`;
                tile.style.backgroundSize = `${containerSize}px ${containerSize}px`;
                
                const origX = (i % GRID_SIZE) * tileSize;
                const origY = Math.floor(i / GRID_SIZE) * tileSize;
                tile.style.backgroundPosition = `-${origX}px -${origY}px`;
                
                tile.addEventListener('click', () => handleTileClick(i));
                puzzleContainer.appendChild(tile);
            }

            shuffleAndRender();
        }

        function shuffleAndRender() {
            moves = 0;
            isPlaying = true;
            
            // Simulación de movimientos aleatorios garantizando que tenga solución matemática
            let lastMove = -1;
            const shuffles = GRID_SIZE * GRID_SIZE * 20; // Aproximadamente 180 iteraciones para 3x3

            for (let i = 0; i < shuffles; i++) {
                const neighbors = getNeighbors(emptyIndex);
                let validNeighbors = neighbors.filter(n => n !== lastMove);
                if (validNeighbors.length === 0) validNeighbors = neighbors; // Prevención de errores
                
                const randomNeighbor = validNeighbors[Math.floor(Math.random() * validNeighbors.length)];
                
                swapTiles(emptyIndex, randomNeighbor);
                lastMove = emptyIndex;
                emptyIndex = randomNeighbor;
            }
            
            // Si por azar quedó resuelto, mezclar nuevamente
            if(checkWinCondition()) {
                shuffleAndRender();
                return;
            }

            renderBoard();
        }

        function getNeighbors(index) {
            const neighbors = [];
            const col = index % GRID_SIZE;
            const row = Math.floor(index / GRID_SIZE);

            if (row > 0) neighbors.push(index - GRID_SIZE); // Arriba
            if (row < GRID_SIZE - 1) neighbors.push(index + GRID_SIZE); // Abajo
            if (col > 0) neighbors.push(index - 1); // Izquierda
            if (col < GRID_SIZE - 1) neighbors.push(index + 1); // Derecha

            return neighbors;
        }

        function swapTiles(idx1, idx2) {
            const temp = board[idx1];
            board[idx1] = board[idx2];
            board[idx2] = temp;
        }

        function handleTileClick(tileOriginalId) {
            if (!isPlaying) return;

            const currentIndex = board.indexOf(tileOriginalId);
            const neighbors = getNeighbors(emptyIndex);
            
            // Si la pieza clickeada es adyacente al hueco, se intercambian
            if (neighbors.includes(currentIndex)) {
                swapTiles(currentIndex, emptyIndex);
                emptyIndex = currentIndex;
                moves++;
                
                renderBoard();
                
                if (checkWinCondition()) {
                    isPlaying = false;
                    setTimeout(showVictory, 250);
                }
            }
        }

        function renderBoard() {
            for (let i = 0; i < TOTAL_TILES; i++) {
                const tileValue = board[i];
                if (tileValue === TOTAL_TILES - 1) continue; 

                const tile = document.getElementById(`tile-${tileValue}`);
                
                const currentX = (i % GRID_SIZE) * tileSize;
                const currentY = Math.floor(i / GRID_SIZE) * tileSize;
                
                tile.style.transform = `translate(${currentX}px, ${currentY}px)`;
            }
        }

        function checkWinCondition() {
            for (let i = 0; i < board.length; i++) {
                if (board[i] !== i) return false;
            }
            return true;
        }

        function showVictory() {
            moveCountDisplay.innerText = moves;
            victoryModal.style.display = 'flex';
            
            setTimeout(() => {
                victoryModal.classList.add('active');
                const modalBox = victoryModal.querySelector('.bg-white');
                modalBox.classList.remove('scale-95');
                modalBox.classList.add('scale-100');
            }, 10);
        }
    </script>
</body>
</html>
